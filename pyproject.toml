[project]
name = "realtime-robot-inference"
version = "0.1.0"
description = "Real-time inference service for a robot fleet: cloud gateway, model workers and robot simulator."
requires-python = "==3.14.*"
dependencies = [
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.1.0.95",
    "uvloop>=0.23.0 ; sys_platform != 'win32'",
    "websockets>=17.4",
]

[dependency-groups]
test = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
bench = [
    "matplotlib>=3.11.2",
    "onnx>=1.23.2",
]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.5",
]

[tool.uv]
# An application run from the repo root, not an installable package.
package = false
default-groups = ["dev", "test", "bench"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.mypy]
python_version = "3.14"
strict = true
files = ["bench", "cloud", "common", "robot", "scripts", "tests", "workers"]

[[tool.mypy.overrides]]
# onnxruntime ships no type information (no py.typed marker).
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "docker: needs the host's docker CLI; make test leaves it out and make test-docker runs it",
]
